apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onesky-http-gateway-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - dss-navcanada.oneskysystems.com
      secretName: dss-tls
  rules:
    - host: dss-navcanada.oneskysystems.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "http-gateway"
                port: 
                  number: 8080
